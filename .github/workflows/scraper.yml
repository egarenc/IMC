name: Ejecutar Scraper de Buybox

on:
  push:
    paths:
      - 'input/asins.xlsx'
  workflow_dispatch:

# Conceder permisos explícitos de escritura al token automático del flujo
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # Forzar checkout de la rama main activa

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegadores de Playwright
        run: |
          npx playwright install chromium --with-deps

      - name: Ejecutar script de scraping
        run: |
          python scraper.py

      - name: Guardar cambios y subir resultados a GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Generado nuevo informe de Buybox"
          file_pattern: "results/*"
