name: Ejecutar Scraper de Buybox

on:
  push:
    paths:
      - 'input/asins.xlsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegadores de Playwright
        run: |
          npx playwright install chromium --with-deps

      - name: Ejecutar script de scraping
        run: |
          python scraper.py

      - name: Verificar archivos generados
        run: |
          echo "=== Contenido de la carpeta results ==="
          ls -la results/ || echo "Carpeta results no existe"
          echo "=== Estado de Git ==="
          git status

      - name: Guardar cambios y subir resultados a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/
          git commit -m "Automated: Generado nuevo informe de Buybox" || echo "No hay cambios para hacer commit"
          git push origin ${{ github.ref_name }}
