name: Executar Scraper de Buybox

on:
  push:
    paths:
      - 'input/asins.xlsx'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegadores de Playwright
        run: |
          npx playwright install chromium --with-deps

      - name: Ejecutar script de scraping
        run: |
          python scraper.py

      - name: Guardar cambios y subir resultados a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Automated: Generado nuevo informe de Buybox" || exit 0
          git push