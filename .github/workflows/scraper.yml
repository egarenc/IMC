name: Ejecutar Scraper de Buybox

on:
  push:
    branches:
      - main
    paths:
      - 'input/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04 # Fijado a Ubuntu 22.04 para compatibilidad de paquetes de Playwright

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegadores de Playwright (Python)
        run: |
          python -m playwright install chromium --with-deps

      - name: Ejecutar script de scraping
        run: |
          python scraper.py

      - name: Guardar cambios y subir resultados a GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Generado informe de Buybox y limpiada la carpeta input"
          file_pattern: "results/* input/*"
