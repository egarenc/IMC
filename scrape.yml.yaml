name: Amazon BuyBox Scraper

on:
  repository_dispatch:
    types: [run-scraper]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Scraping de Amazon
        run: |
          python amazon_buybox.py "${{ github.event.client_payload.url }}" "${{ github.event.client_payload.req_id }}"

      - name: Publicar Excel en rama pública
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: despliegue-excel
          keep_files: true  # 'true' para mantener el historial de ficheros anteriores