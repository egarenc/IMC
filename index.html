<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Scraper Buybox Amazon</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    button { background: #0066cc; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #888; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

  <h1>Extracción de datos Buybox</h1>

  <div class="card">
    <h2>1. Cargar archivo Excel (ASIN)</h2>
    <input type="file" id="excelInput" accept=".xlsx, .xls">
    <br><br>
    <button id="uploadBtn" onclick="uploadFile()">Procesar ASINs</button>
    <p id="status"></p>
  </div>

  <div class="card">
    <h2>2. Últimos 10 informes generados</h2>
    <ul id="fileIndex">Cargando lista...</ul>
  </div>

  <script>
    // Token con permisos mínimos (Contents: Read/Write) configurado para la app
    const GITHUB_CONFIG = {
      owner: "TU_USUARIO_O_ORGANIZACION",
      repo: "NOMBRE_DEL_REPOSITORIO",
      branch: "main",
      // Para evitar que los usuarios tengan cuenta, se usa un Fine-Grained PAT embebido 
      // limitado EXCLUSIVAMENTE a modificar el repo de este proyecto.
      token: "ghp_TU_FINE_GRAINED_TOKEN_AQUI" 
    };

    // 1. Subir archivo Excel a la carpeta input/
    async function uploadFile() {
      const fileInput = document.getElementById('excelInput');
      const status = document.getElementById('status');
      const btn = document.getElementById('uploadBtn');

      if (!fileInput.files[0]) {
        alert("Por favor, selecciona un archivo Excel.");
        return;
      }

      btn.disabled = true;
      status.innerText = "Subiendo archivo e iniciando procesamiento...";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        const contentBase64 = e.target.result.split(',')[1];
        const path = "input/asins.xlsx";
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`;

        try {
          // Obtener SHA previo si el archivo existe para poder sobrescribirlo
          let sha = "";
          const getRes = await fetch(url, {
            headers: { "Authorization": `Bearer ${GITHUB_CONFIG.token}` }
          });
          if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
          }

          // Subir nuevo archivo
          const putRes = await fetch(url, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${GITHUB_CONFIG.token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: "Carga de nuevo Excel con ASINs",
              content: contentBase64,
              branch: GITHUB_CONFIG.branch,
              ...(sha && { sha })
            })
          });

          if (putRes.ok) {
            status.innerText = "¡Archivo subido correctamente! El scraper se ha iniciado en segundo plano. Los resultados estarán listos en unos minutos.";
          } else {
            throw new Error("Error en la llamada a la API de GitHub");
          }
        } catch (err) {
          status.innerText = "Error al procesar la solicitud: " + err.message;
        } finally {
          btn.disabled = false;
        }
      };

      reader.readAsDataURL(file);
    }

    // 2. Cargar índice de los últimos 10 archivos generados
    async function loadIndex() {
      const listEl = document.getElementById('fileIndex');
      const url = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/results/index.json?t=${Date.now()}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("No hay archivos generados aún.");
        const files = await res.json();

        listEl.innerHTML = files.map(file => `
          <li>
            📄 <strong>${file.name}</strong> (${file.date}) - 
            <a href="${file.url}" download>Descargar Excel</a>
          </li>
        `).join('');
      } catch (err) {
        listEl.innerHTML = "<li>Aún no hay archivos de resultados disponibles.</li>";
      }
    }

    loadIndex();
  </script>
</body>
</html>
